<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Coach</title>
<style>
:root{--bg:#0a0e13;--card:#121a23;--card2:#18222e;--line:#243140;--tx:#e6edf3;--mut:#8b9bb0;--dim:#5b6b80;
--swim:#38bdf8;--bike:#f59e0b;--run:#22c55e;--str:#a78bfa;--oth:#64748b;--go:#22c55e;--watch:#f59e0b;--swap:#ef4444;--stale:#64748b;
--z1:#64748b;--z2:#38bdf8;--z3:#22c55e;--z4:#f59e0b;--z5:#ef4444;--z6:#d946ef}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{-webkit-user-select:none;user-select:none;touch-action:pan-y}
input,textarea,.sel,.sel *{-webkit-user-select:text;user-select:text}
body{padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;letter-spacing:.3px}header>div{min-width:0}
header .sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button.icon{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:11px;width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s,color .12s}
header button.icon svg{width:19px;height:19px}
header button.icon:active{transform:scale(.9)}
header button.icon.on{color:var(--swim);border-color:#2a4a63}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--card2);color:var(--mut);white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:15px;margin:0 0 4px}
.grid{display:grid;gap:10px}.grid>*{min-width:0}svg{max-width:100%}html,body{overflow-x:hidden}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(min-width:700px){.wide2{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card2);border-radius:10px;padding:8px 10px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px}
.kpi .s{font-size:11px;color:var(--dim)}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.verdict{border-radius:16px;padding:14px 16px;margin:10px 0;border:1px solid}
.verdict .t{font-size:20px;font-weight:800;line-height:1.2}
.verdict.GO{background:linear-gradient(135deg,#0f2a1a,#121a23);border-color:#1f6b3a}
.verdict.WATCH{background:linear-gradient(135deg,#2e2208,#121a23);border-color:#7a5a12}
.verdict.SWAP{background:linear-gradient(135deg,#2e0f0f,#121a23);border-color:#7f1d1d}
.verdict.STALE{background:linear-gradient(135deg,#1a2230,#121a23);border-color:#334155}
.sig{background:var(--card2);border-radius:12px;padding:8px 10px;border-left:4px solid var(--go)}
.sig.bad{border-left-color:var(--swap)}
.sig .n{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.sig .v{font-size:19px;font-weight:700}
.sess{border-radius:12px;background:var(--card2);padding:10px 12px;margin:8px 0;border-left:5px solid var(--oth)}
.sess .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sess .ti{font-weight:700}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:8px;margin:4px 4px 0 0;background:#0d141c;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.badge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.5px}
.KEY{background:#7f1d1d;color:#fecaca}.CORE{background:#1e3a5f;color:#bfdbfe}.OPT{background:#334155;color:#cbd5e1}.TEST{background:#5b21b6;color:#ede9fe}.RACE{background:#a16207;color:#fef3c7}.REST{background:#1f2937;color:#9ca3af}
details summary{cursor:pointer;color:var(--mut);font-size:12px;margin-top:6px}
details[open] summary{margin-bottom:4px}
.rx{font-size:13px;color:#c9d4df;white-space:pre-wrap}
.adv{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.adv:first-child{border-top:0}
.adv .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--swim)}
.adv .src{font-size:11px;color:var(--dim);margin-top:2px}
.flag{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.flag:first-child{border-top:0}
.flag .b{width:6px;border-radius:3px;flex:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:rgba(14,19,26,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--dim);font:600 10px/1.2 inherit;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button{position:relative;transition:transform .12s ease,color .15s ease}
nav button:active{transform:scale(.88)}
nav button.on{color:var(--tx)}
nav button.on svg{stroke:var(--swim)}
nav button.on::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--swim)}
.seg{display:inline-flex;background:var(--card2);border-radius:9px;padding:2px}
.seg button{background:none;border:0;color:var(--mut);font:600 12px inherit;padding:5px 10px;border-radius:7px}
.seg button.on{background:#2a3a4d;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--mut);text-align:left;font-weight:600;padding:5px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid #1b2531}
.zb{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{font-family:inherit}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.conf{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
.HIGH,.MED-HIGH{background:#14532d;color:#bbf7d0}.MED{background:#1e3a5f;color:#bfdbfe}.LOW-MED,.LOW{background:#713f12;color:#fde68a}
input,select{background:#0d141c;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px;font:inherit;width:100%}
button.btn{background:#1d4ed8;border:0;color:#fff;font:600 14px inherit;padding:11px 16px;border-radius:12px;transition:transform .12s,filter .12s}
button.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line);font:600 13px inherit;padding:9px 13px;border-radius:11px;transition:transform .12s,filter .12s}
button.btn:active,button.ghost:active,.seg button:active{transform:scale(.96);filter:brightness(.86)}
button.btn:disabled,button.ghost:disabled{opacity:.5}
button.danger{background:#3b1518;color:#fca5a5;border-color:#7f1d1d}
.ok{color:#86efac}.warnc{color:#fcd34d}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{min-width:0;background:var(--card2);border-radius:8px;padding:4px 3px;min-height:74px;font-size:11px}
.day.today{outline:2px solid var(--swim)}
.day .dn{color:var(--mut);font-weight:700;font-size:10px}
.chip{overflow-wrap:anywhere;hyphens:auto;border-radius:5px;padding:2px 3px;margin-top:3px;font-size:9px;line-height:1.2;color:#0a0e13;font-weight:600}
.ckey{box-shadow:inset 0 -3px 0 #b91c1c}
.st-done{opacity:1}.st-missed{opacity:.45;text-decoration:line-through}.st-short{opacity:.8}.st-swapped{opacity:.6}.st-nodata{opacity:.7;outline:1px dashed #64748b}
.act{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.act:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:800;color:#0a0e13}
.lock{max-width:380px;margin:12vh auto;padding:20px}
/* --- app feel: view transition, pull to refresh, toast, install hint --- */
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
main.anim{animation:vin .2s cubic-bezier(.2,.8,.2,1)}
#ptr{position:fixed;left:0;right:0;top:0;z-index:7;display:flex;align-items:flex-end;justify-content:center;height:0;overflow:hidden;pointer-events:none;color:var(--mut)}
#ptr div{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding-bottom:6px}
#ptr svg{width:17px;height:17px;transition:transform .2s}
#ptr.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;background:#1f2b3a;border:1px solid var(--line);color:var(--tx);font-size:13px;font-weight:600;padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#a2hs{margin:10px 12px 0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mut);display:flex;gap:10px;align-items:center}
.sk{background:linear-gradient(90deg,#141d27,#1b2734,#141d27);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:10px;height:14px;margin:9px 0}
@keyframes shim{to{background-position:-200% 0}}
.set label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
.set .hint{font-size:11px;color:var(--dim);margin-top:5px}
.dotst{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block;vertical-align:0}
.err{color:#fca5a5;font-size:13px}
.hide{display:none}
</style>

<main id="app"><div class="card"><div class="sk" style="width:45%"></div><div class="sk"></div><div class="sk" style="width:80%"></div></div><div class="card"><div class="sk" style="width:30%"></div><div class="sk" style="height:60px"></div></div></main>

<!--LOCAL-->
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r0=x=>x==null?null:Math.round(x);
const mmss=s=>{if(s==null||isNaN(s))return'--';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hms=s=>{if(s==null||isNaN(s))return'--';s=Math.round(s);return Math.floor(s/3600)+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const hm=s=>{if(s==null)return'--';s=Math.round(s/60);return s>=60?Math.floor(s/60)+'h'+String(s%60).padStart(2,'0'):s+"'"};
const D=s=>new Date(s+'T12:00:00');
const iso=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fd=s=>{const d=D(s);return d.getDate()+' '+MON[d.getMonth()]};
const fdw=s=>{const d=D(s);return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const SP={swim:['var(--swim)','SW'],bike:['var(--bike)','BK'],run:['var(--run)','RN'],strength:['var(--str)','ST'],multi:['#f472b6','TRI'],other:['var(--oth)','..']};
const PSP={Swim:'swim',Bike:'bike',Run:'run',Brick:'run',Strength:'strength',Triathlon:'multi',Other:'other',Rest:'other'};
const AIC=a=>({walking:'WK',hiking:'HK',soccer:'FB',breathwork:'BR',pilates:'PI',hiit:'HI',transition_v2:'T'})[a.type]||(SP[a.sport]||SP.other)[1];
const spc=s=>(SP[s]||SP.other)[0];
const ZC=['var(--z1)','var(--z2)','var(--z3)','var(--z4)','var(--z5)','var(--z6)','#f0abfc'];
let P=null, TAB=(location.hash||'').slice(1)||localStorage.getItem('coachTab')||'today', TH=null;

/* ---------- data: embedded (PC copy) or encrypted file (phone) ---------- */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function deriveKey(pass,box){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(box.salt),iterations:box.rounds},base,256);
  return ub64(bits);
}
async function openBox(box,kb64){
  const key=await crypto.subtle.importKey('raw',b64(kb64),'AES-GCM',false,['decrypt']);
  let raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(box.iv)},key,b64(box.ct));
  if(box.gz){const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));raw=await new Response(s).arrayBuffer()}
  return JSON.parse(new TextDecoder().decode(raw));
}
async function boot(){
  if(window.COACH_DATA){P=window.COACH_DATA;return start()}
  let box;
  try{box=await (await fetch('coach.enc.json?t='+Date.now(),{cache:'no-store'})).json()}
  catch(e){try{box=await (await fetch('coach.enc.json')).json()}catch(e2){return lockScreen('Could not load the data file (offline and nothing cached yet).')}}
  if(box&&box.salt)BOXMETA={salt:box.salt,rounds:box.rounds};
  const k=localStorage.getItem('coachKey');
  if(k){try{P=await openBox(box,k);return start()}catch(e){localStorage.removeItem('coachKey')}}
  lockScreen('',box);
}
function lockScreen(msg,box){
  $('#hsub').textContent='locked';
  $('#app').innerHTML=`<div class="lock card"><h3>Private training data</h3><p class="mut small">The file on this site is encrypted. Type your passphrase once; this phone keeps the key, never the passphrase.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase"><div style="height:10px"></div>
  <button class="btn" id="go" ${box?'':'disabled'}>Open</button><p class="err" id="perr">${esc(msg)}</p></div>`;
  const go=async()=>{$('#perr').textContent='Unlocking (a second or two)...';
    try{const k=await deriveKey($('#pw').value.trim(),box);P=await openBox(box,k);localStorage.setItem('coachKey',k);start()}
    catch(e){$('#perr').textContent='Wrong passphrase, or the file changed while loading. Try again.'}};
  $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}

/* ---------- thresholds: the payload's, plus test results typed on this phone ---------- */
function loadTH(){
  TH=JSON.parse(JSON.stringify(P.th));
  const ov=JSON.parse(localStorage.getItem('coachOv')||'{}');
  for(const k in ov){if(ov[k]&&ov[k].v){TH[k]=Object.assign({},TH[k]||{},ov[k],{conf:'HIGH',local:true})}}
}
const tv=k=>(TH[k]||{}).v;
function zoneTables(){
  const M=P.model,t={};
  if(tv('run_pace'))t.run_pace=M.run_pace.map(([n,a,b])=>[n,tv('run_pace')*a,tv('run_pace')*b]);
  if(tv('run_lthr'))t.run_hr=M.run_hr.map(([n,a,b])=>[n,tv('run_lthr')*a,tv('run_lthr')*b]);
  if(tv('bike_ftp'))t.bike_w=M.bike_w.map(([n,a,b])=>[n,tv('bike_ftp')*a,tv('bike_ftp')*b]);
  if(tv('bike_lthr'))t.bike_hr=M.bike_hr.map(([n,a,b])=>[n,tv('bike_lthr')*a,tv('bike_lthr')*b]);
  if(tv('swim_css'))t.swim=M.swim.map(([n,a,b])=>[n,tv('swim_css')+a,tv('swim_css')+b]);
  return t;
}
/* same logic as engine.targets(): plan zone label -> his numbers */
function targets(sport,zone){
  zone=zone||'';const M=P.model,out=[];
  const f=[...zone.matchAll(/Z([1-6])([abc]?)/g)].map(m=>+m[1]);
  let lo=f.length?Math.min(...f):null,hi=f.length?Math.max(...f):null;
  const pick=(T,a,b)=>[T[Math.min(a,T.length)-1],T[Math.min(b,T.length)-1]];
  if((sport==='Run'||sport==='Brick')&&lo){
    if(tv('run_lthr')&&!zone.includes('short')){const[z1,z2]=pick(M.run_hr,lo,hi);out.push(`HR ${r0(tv('run_lthr')*z1[1])}-${r0(tv('run_lthr')*z2[2])}`)}
    if(tv('run_pace')){const[z1,z2]=pick(M.run_pace,lo,hi);out.push(`pace ${mmss(tv('run_pace')*z2[1])}-${mmss(tv('run_pace')*z1[2])}/km`)}
  }
  if((sport==='Run'||sport==='Brick')&&zone.includes('70.3')&&tv('run_pace')){const[a,b]=M.race.run_703;out.push(`70.3 pace ${mmss(tv('run_pace')*a)}-${mmss(tv('run_pace')*b)}/km`)}
  if(sport==='Bike'){
    if(zone.includes('SST')){lo=hi=null;
      if(tv('bike_ftp'))out.push(`${r0(tv('bike_ftp')*.88)}-${r0(tv('bike_ftp')*.93)} W`);
      if(tv('bike_lthr'))out.push(`HR ${r0(tv('bike_lthr')*.94)}-${r0(tv('bike_lthr')*.97)}`)}
    if(lo){
      if(tv('bike_lthr')){const[z1,z2]=pick(M.bike_hr,lo,hi);out.push(`HR ${r0(tv('bike_lthr')*z1[1])}-${r0(tv('bike_lthr')*z2[2])}`)}
      if(tv('bike_ftp')){const T=[0,1,2,4,5,6].map(i=>M.bike_w[i]);const[z1,z2]=pick(T,lo,hi);out.push(`${r0(tv('bike_ftp')*z1[1])}-${r0(tv('bike_ftp')*z2[2])} W indoors`)}
    }
    if(zone.includes('70.3')){
      if(tv('bike_ftp')){const[a,b]=M.race.bike_703_valencia;out.push(`70.3 ${r0(tv('bike_ftp')*a)}-${r0(tv('bike_ftp')*b)} W`)}
      if(tv('bike_lthr')){const[a,b]=M.race.bike_hr_703;out.push(`70.3 HR ${r0(tv('bike_lthr')*a)}-${r0(tv('bike_lthr')*b)}`)}
    }
  }

function zTable(rows,fmt,title,color,unit){if(!rows)return'';return `<div class="card"><h2>${title}</h2><table><tr><th>Zone</th><th>From</th><th>To</th><th style="width:40%"></th></tr>

  <div class="tiny dim" style="margin-top:6px">Swim CSS+${M.swim_703[0]}-${M.swim_703[1]} s; bike ${M.bike_703_valencia.map(x=>Math.round(x*100)).join('-')}% FTP (La Santa ${M.bike_703_lanzarote.map(x=>Math.round(x*100)).join('-')}%), HR ${M.bike_hr_703.map(x=>Math.round(x*100)).join('-')}% bike LTHR without a power meter; run ${M.run_703.join('-')} x threshold pace. Season plan v3.2.</div></div>
  ${zTable(zt.run_hr,r0,'Run heart rate','', '% of run LTHR, Friel')}${zTable(zt.run_pace,mmss,'Run pace /km','','x threshold pace, Friel')}
  ${zTable(zt.bike_hr,r0,'Bike heart rate (outdoors)','','% of bike LTHR')}${zTable(zt.bike_w,r0,'Bike power (trainer)','','% of FTP, Coggan; SST 88-93%')}
  ${zTable(zt.swim,mmss,'Swim pace /100 m','','CSS offsets in seconds')}
  <div class="card"><h2>Enter a test <span class="tiny dim">saved on this phone</span></h2>
   <div class="small mut">Same formulas as the tests in your plan. Zones and every session target update at once.</div>
   <div style="margin-top:10px"><b class="small">Swim CSS test</b><div class="grid g2" style="margin-top:4px"><input id="t400" placeholder="400 m time  m:ss"><input id="t200" placeholder="200 m time  m:ss"></div></div>
   <div style="margin-top:10px"><b class="small">Bike 20' test (trainer)</b><div class="grid g2" style="margin-top:4px"><input id="fw" inputmode="numeric" placeholder="avg power W"><input id="fh" inputmode="numeric" placeholder="avg HR"></div></div>
   <div style="margin-top:10px"><b class="small">Run 30' time trial, last 20'</b><div class="grid g2" style="margin-top:4px"><input id="rp" placeholder="avg pace  m:ss /km"><input id="rh" inputmode="numeric" placeholder="avg HR"></div></div>
   <div style="margin-top:10px"><b class="small">Or set one directly</b><div class="grid g2" style="margin-top:4px"><select id="ok">${THL.slice(0,6).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input id="ov" placeholder="value (pace as m:ss)"></div></div>

AFTER.zones=()=>{
  const sec=s=>{if(!s)return null;const m=String(s).trim().match(/^(\d+):(\d{1,2})$/);return m?(+m[1])*60+(+m[2]):(isNaN(+s)?null:+s)};
  $('#tsave').onclick=()=>{const ov=JSON.parse(localStorage.getItem('coachOv')||'{}'),d=iso(new Date()),msg=[];
    const a=sec($('#t400').value),b=sec($('#t200').value);if(a&&b&&a>b){ov.swim_css={v:Math.round((a-b)/2),d,src:'Your CSS test (T400-T200)/2'};msg.push('CSS '+mmss((a-b)/2))}
    const w=+$('#fw').value,h=+$('#fh').value;if(w>50){ov.bike_ftp={v:Math.round(w*.95),d,src:"Your 20' test x 0.95"};msg.push('FTP '+Math.round(w*.95))}
    if(h>80){ov.bike_lthr={v:Math.round(h*.95),d,src:"0.95 x avg HR of your 20' test"};msg.push('bike LTHR '+Math.round(h*.95))}
    const p=sec($('#rp').value),rh=+$('#rh').value;if(p&&p>150){ov.run_pace={v:p,d,src:"Your 30' TT, last 20'"};msg.push('threshold '+mmss(p))}
    if(rh>100){ov.run_lthr={v:rh,d,src:"Your 30' TT, avg HR last 20'"};msg.push('run LTHR '+rh)}
    const k=$('#ok').value,x=$('#ov').value.trim();if(x){const v=(k==='run_pace'||k==='swim_css')?sec(x):+x;if(v){ov[k]={v,d,src:'Entered by you'};msg.push(k+' '+x)}}
    localStorage.setItem('coachOv',JSON.stringify(ov));loadTH();render();$('#tmsg').textContent=msg.length?'Saved: '+msg.join(', '):'Nothing to save: fill a test.'};
  $('#treset').onclick=()=>{localStorage.removeItem('coachOv');loadTH();render()}};

/* ---------- Settings: GitHub link, Garmin key, builds (all from the phone) ---------- */
const GH='https://api.github.com';
const ghRepo=()=>localStorage.getItem('ghRepo')||'d10crack/coach-src';
const ghTok=()=>localStorage.getItem('ghToken')||'';
const GKEY='coach/data/garmin.enc.json';
let BOXMETA={salt:'coach/teletext/v1',rounds:600000};
async function gh(path,opt){
  const t=ghTok(); if(!t)throw new Error('No GitHub token saved yet');
  const r=await fetch(GH+path,{...(opt||{}),headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...((opt||{}).headers||{})}});
  if(r.status===404)return null;
  if(!r.ok){let m='';try{m=(await r.json()).message||''}catch(e){}
    throw new Error(r.status===401?'GitHub refused the token (401). Make a new one.':r.status===403?'The token lacks permission for this repo (403).':`GitHub ${r.status} ${m}`)}
  return r.status===204?true:r.json();
}
async function sealBox(obj){
  const kb=localStorage.getItem('coachKey'); if(!kb)throw new Error('App is locked');
  const key=await crypto.subtle.importKey('raw',b64(kb),'AES-GCM',false,['encrypt']);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1,alg:'AES-GCM/PBKDF2-SHA256',rounds:BOXMETA.rounds,salt:BOXMETA.salt,gz:0,iv:ub64(iv),ct:ub64(ct)};
}
const utf8b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function garminStored(){
  const f=await gh(`/repos/${ghRepo()}/contents/${GKEY}`);
  if(!f)return null;
  try{
    const box=JSON.parse(new TextDecoder().decode(b64(f.content.replace(/\n/g,''))));
    const o=await openBox(box,localStorage.getItem('coachKey'));
    return {...o,sha:f.sha};
  }catch(e){return {bad:e.message,sha:f.sha}}
}
async function garminSave(k,exp){
  const cur=await gh(`/repos/${ghRepo()}/contents/${GKEY}`);
  const box=await sealBox({key:k,expires:exp||null,saved:new Date().toISOString().slice(0,16)});
  await gh(`/repos/${ghRepo()}/contents/${GKEY}`,{method:'PUT',body:JSON.stringify({
    message:'Garmin key from the app (encrypted)',content:utf8b64(JSON.stringify(box)),...(cur?{sha:cur.sha}:{})})});
}
async function buildNow(){ await gh(`/repos/${ghRepo()}/actions/workflows/coach.yml/dispatches`,{method:'POST',body:JSON.stringify({ref:'main'})}) }
async function lastRun(){ const d=await gh(`/repos/${ghRepo()}/actions/runs?per_page=1`); return d&&d.workflow_runs&&d.workflow_runs[0] }
const RUNTX={queued:'queued',in_progress:'building now',completed:'finished'};
async function watchRun(el,known){
  for(let i=0;i<60;i++){
    await new Promise(r=>setTimeout(r,6000));
    let r; try{r=await lastRun()}catch(e){el.textContent='Could not read the build: '+e.message;return}
    if(!r)continue;
    if(r.id===known&&r.status==='completed'){el.textContent='Waiting for the build to start...';continue}
    el.innerHTML=`Build ${esc(RUNTX[r.status]||r.status)}${r.conclusion?' ('+esc(r.conclusion)+')':''} <a href="${esc(r.html_url)}" target="_blank" style="color:var(--swim)">open on GitHub</a>`;
    if(r.status==='completed'){
      if(r.conclusion==='success'){el.textContent='Build finished. Loading the new data...';await new Promise(r2=>setTimeout(r2,12000));await refresh();el.textContent='Up to date.'}
      else el.innerHTML=`Build ${esc(r.conclusion)}. <a href="${esc(r.html_url)}" target="_blank" style="color:var(--swim)">see the log</a>`;
      return;
    }
  }
  el.textContent='Still building after 6 minutes: check GitHub.';
}
function vSet(){
  const live=(P.src&&P.src.live)||{},errs=P.errors||[];
  const age=Math.round((Date.now()-new Date(P.built).getTime())/36e5);
  return `<div class="card set"><h2>Data</h2>
   <div class="grid g2">
    <div class="kpi"><div class="l">Built</div><div class="v" style="font-size:16px">${P.built.slice(11,16)}</div><div class="s">${age>0?age+' h ago':'just now'}</div></div>
    <div class="kpi"><div class="l">Newest data</div><div class="v" style="font-size:16px">${fd(P.horizon)}</div><div class="s">export to ${fd(P.src.garmin_export.last_day)}</div></div>
   </div>
   <div class="small" style="margin-top:8px">Live source: <b>${esc(live.source||'export only')}</b>${live.source?` (+${live.acts||0} activities, +${live.nights||0} days)`:''}</div>
   ${errs.map(e=>`<div class="tiny warnc" style="margin-top:4px">Sync problem: ${esc(e)}</div>`).join('')}
   <div class="row" style="margin-top:10px;gap:8px"><button class="btn" id="sbuild">Update now</button><button class="ghost" id="sreload">Reload data</button></div>
   <div class="tiny dim" id="srun" style="margin-top:7px">Pull the screen down from the top to reload at any time.</div></div>

  <div class="card set"><h2>Garmin</h2>
   <div class="small" id="gstat"><span class="dotst" style="background:var(--dim)"></span> checking...</div>
   <div id="gform" class="hide">
    <label for="gkey">Personal API key</label>
    <input id="gkey" type="password" autocomplete="off" spellcheck="false" placeholder="GCDC_...">
    <label for="gexp">Expires on (Garmin sets it when you create the key)</label>
    <input id="gexp" type="date">
    <div class="row" style="margin-top:10px;gap:8px"><button class="btn" id="gsave">Save key</button><button class="ghost danger" id="gdel">Remove</button></div>
    <div class="hint">The key is encrypted with your passphrase on this phone before it leaves it, and stored in your private repo. The hourly build decrypts it there. Make or renew a key on <a href="https://connect.garmin.com/app/settings/personalApiToken" target="_blank" style="color:var(--swim)">Garmin Connect</a>, then paste it here: no more intervals.icu.</div>
   </div>
   <div class="tiny dim" id="gmsg" style="margin-top:7px"></div></div>

  <div class="card set"><h2>GitHub link</h2>
   <div class="small" id="tstat"></div>
   <label for="tok">Access token (kept on this phone only)</label>
   <input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_...">
   <div class="row" style="margin-top:10px;gap:8px"><button class="btn" id="tsave">Save and test</button><button class="ghost danger" id="tdel">Forget</button></div>
   <div class="hint">Needed so this app can save the Garmin key and ask for a build. Create it at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" style="color:var(--swim)">github.com fine-grained tokens</a>: pick only the repository <b>${esc(ghRepo().split('/')[1])}</b>, and set permissions <b>Contents: read and write</b> plus <b>Actions: read and write</b>.</div></div>

  <div class="card set"><h2>This app</h2>
   <div class="row wrap" style="gap:8px"><button class="ghost" id="alock">Lock now</button><button class="ghost" id="aupd">Update the app</button></div>
   <div class="hint">Lock forgets the key on this phone, so the passphrase is asked again. Update re-downloads the app shell, for when I have changed it.</div>
   <div class="tiny dim" style="margin-top:8px">Plan ${esc((P.plan&&P.plan.source)||'')} | engine payload v${esc(String(P.v))} | repo ${esc(ghRepo())}</div></div>`;
}
AFTER.set=()=>{
  const gs=$('#gstat'),gm=$('#gmsg'),ts=$('#tstat'),run=$('#srun');
  const dot=(c,t)=>`<span class="dotst" style="background:${c}"></span> ${t}`;
  const hasTok=!!ghTok();
  ts.innerHTML=hasTok?dot('#22c55e','Connected to '+esc(ghRepo())):dot('#f59e0b','Not connected: the two buttons above need it');
  $('#tok').value='';
  if(!hasTok){gs.innerHTML=dot('#f59e0b','Connect GitHub below first, then set the Garmin key here.')}
  else{
    $('#gform').classList.remove('hide');
    garminStored().then(g=>{
      if(!g){gs.innerHTML=dot('#f59e0b','No Garmin key saved: the app only has your export data.');return}
      if(g.bad){gs.innerHTML=dot('#ef4444','A key is saved but this phone cannot read it: '+esc(g.bad));return}
      const left=g.expires?Math.round((D(g.expires)-Date.now())/864e5):null;
      const col=left==null?'#38bdf8':left<0?'#ef4444':left<21?'#f59e0b':'#22c55e';
      gs.innerHTML=dot(col,`Key saved ${esc((g.saved||'').slice(0,10))}, ending <b>${esc(String(g.key||'').slice(-6))}</b>`+
        (g.expires?(left<0?` &mdash; <b>expired ${esc(g.expires)}</b>, make a new one`:left<21?` &mdash; expires ${esc(g.expires)}, in ${left} days`:` &mdash; expires ${esc(g.expires)}`):' &mdash; no expiry date noted'));
      if(g.expires)$('#gexp').value=g.expires;
    }).catch(e=>{gs.innerHTML=dot('#ef4444',esc(e.message))});
  }
  $('#tsave').onclick=async()=>{
    const t=$('#tok').value.trim(); if(!t)return toast('Paste the token first');
    localStorage.setItem('ghToken',t);
    try{const r=await gh(`/repos/${ghRepo()}`);if(!r)throw new Error('Repo not found for this token');toast('GitHub connected');render()}
    catch(e){localStorage.removeItem('ghToken');ts.innerHTML=dot('#ef4444',esc(e.message))}
  };
  $('#tdel').onclick=()=>{localStorage.removeItem('ghToken');toast('Token forgotten');render()};
  $('#gsave').onclick=async()=>{
    const k=$('#gkey').value.trim(),exp=$('#gexp').value||null;
    if(k.length<30)return toast('That does not look like a Garmin key');
    gm.textContent='Saving (encrypted)...';
    try{
      const known=(await lastRun())||{};
      await garminSave(k,exp);
      $('#gkey').value='';
      gm.textContent='Saved. A build has started; the new data lands in a couple of minutes.';
      toast('Garmin key saved');
      watchRun(run,known.id);
      render();
    }catch(e){gm.innerHTML='<span class="err">'+esc(e.message)+'</span>'}
  };
  $('#gdel').onclick=async()=>{
    if(!confirm('Remove the Garmin key from the repo? The app falls back to the export data.'))return;
    try{const f=await gh(`/repos/${ghRepo()}/contents/${GKEY}`);
      if(!f)return toast('There was no key saved');
      await gh(`/repos/${ghRepo()}/contents/${GKEY}`,{method:'DELETE',body:JSON.stringify({message:'Remove the Garmin key',sha:f.sha})});
      toast('Key removed');render()}
    catch(e){gm.innerHTML='<span class="err">'+esc(e.message)+'</span>'}
  };
  $('#sbuild').onclick=async()=>{
    run.textContent='Asking GitHub for a build...';
    try{const known=(await lastRun())||{};await buildNow();run.textContent='Build requested.';watchRun(run,known.id)}
    catch(e){run.innerHTML='<span class="err">'+esc(e.message)+'</span>'}
  };
  $('#sreload').onclick=()=>refresh();
  $('#alock').onclick=()=>{if(confirm('Ask for the passphrase next time?')){localStorage.removeItem('coachKey');location.reload()}};
  $('#aupd').onclick=async()=>{
    try{if('caches' in window)for(const k of await caches.keys())await caches.delete(k);
      if(navigator.serviceWorker){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}
    catch(e){}
    location.reload();
  };
};

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
swipeable();pullToRefresh();
addEventListener('online',netPill);addEventListener('offline',netPill);
addEventListener('visibilitychange',()=>{if(!document.hidden&&P&&(Date.now()-new Date(P.built).getTime())>36e5)refresh(true)});
addEventListener('hashchange',()=>{const t=(location.hash||'').slice(1);if(t&&t!==TAB)go(t)});
/* in Safari, not installed: say so once */
if(!window.COACH_DATA&&!matchMedia('(display-mode:standalone)').matches&&!navigator.standalone&&/iPhone|iPad|Android/.test(navigator.userAgent)&&!localStorage.getItem('a2hsHid')){
  const d=document.createElement('div');d.id='a2hs';
  d.innerHTML='<span style="flex:1">For the full app: <b>Share</b> then <b>Add to Home Screen</b>.</span><button class="ghost" id="a2hsx">Got it</button>';
  document.querySelector('header').after(d);
  d.querySelector('#a2hsx').onclick=()=>{localStorage.setItem('a2hsHid','1');d.remove()};
}
boot();
</script>
